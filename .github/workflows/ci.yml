name: CI

on:
  push:
  pull_request:

jobs:
  scaffold-checks:
    name: Scaffold checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local-equivalent checks
        run: corepack pnpm ci:check
